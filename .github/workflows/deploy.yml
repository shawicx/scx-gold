# ============================================================
# @description scx-gold CI/CD 工作流（测试 + 部署）
# ------------------------------------------------------------
# 触发条件：
#   - push 到 main：跑测试 → 构建镜像 → 推送 ACR → SSH 部署到 ECS
#   - pull_request 到 main：仅跑测试（不部署）
#   - workflow_dispatch：手动触发完整流程
#
# Job 依赖链：test → (build-and-push → deploy)
#   deploy 仅在 push main / workflow_dispatch 时执行；PR 只跑 test。
#
# 部署链路：
#   docker build（Node 构建静态文件 + nginx 打包）
#   → docker tag → docker push (阿里云 ACR)
#   → SSH 登录 ECS → docker pull
#   → 启动 nginx 容器（监听 6900，--network host 反代 API 到 3800）
#   → 健康检查（轮询 http://localhost:6900）
#
# 依赖的 GitHub Secrets（与 scx-backend 共用）：
#   ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD
#   ECS_HOST / ECS_USER / ECS_SSH_KEY
# ============================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: { }

concurrency:
  group: cicd-scx-gold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1：测试（push + PR 均执行）
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  # ============================================================
  # Job 2：构建 nginx 镜像并推送到阿里云 ACR（仅 push main / 手动触发）
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scx-gold:latest .

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Tag & Push image
        env:
          TARGET_NS: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHORT_SHA:0:7}"
          TARGET="$TARGET_NS/scx-gold"
          echo "==> 推送 scx-gold"
          docker tag scx-gold:latest "$TARGET:latest"
          docker tag scx-gold:latest "$TARGET:sha-$SHORT"
          docker push "$TARGET:latest"
          docker push "$TARGET:sha-$SHORT"
          echo "    ✓ $TARGET:latest (sha-$SHORT)"

  # ============================================================
  # Job 3：SSH 登录 ECS，拉取镜像并启动 nginx 容器
  # ============================================================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH deploy & health check
        uses: appleboy/ssh-action@v1
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 15m
          envs: ACR_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD
          script: |
            set -euo pipefail

            NS="$ACR_REGISTRY/$ACR_NAMESPACE"
            IMAGE="$NS/scx-gold:latest"

            echo "==> 登录阿里云 ACR"
            docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" -p "$ACR_PASSWORD"

            echo "==> 拉取镜像: $IMAGE"
            docker pull "$IMAGE"

            # 停止并删除旧容器
            stop_and_rm() {
              docker stop "$1" 2>/dev/null || true
              docker rm   "$1" 2>/dev/null || true
            }

            echo "==> 启动 scx-gold nginx (6900)"
            stop_and_rm scx-gold
            docker run -d \
              --name scx-gold \
              --network host \
              --restart=always \
              -m 128m \
              "$IMAGE"

            echo "==> 清理悬空镜像"
            docker image prune -f

            # 健康检查：轮询 nginx 端口（最多 30 秒）
            echo "==> 健康检查: 轮询 http://localhost:6900"
            for i in $(seq 1 6); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6900 || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "健康检查通过（第 $((i*5)) 秒，HTTP 200）"
                echo "--- 运行中的 gold 容器 ---"
                docker ps --filter "name=scx-gold" --format "table {{.Names}}\t{{.Status}}"
                exit 0
              fi
              echo "  等待 nginx 启动... ($i/6, HTTP $HTTP_CODE)"
              sleep 5
            done

            echo "ERROR: 健康检查超时（30 秒内 nginx 未就绪）"
            echo "--- scx-gold 容器状态 ---"
            docker ps -a --filter "name=scx-gold" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- scx-gold 容器最近日志 ---"
            docker logs --tail 80 scx-gold || true
            exit 1
